<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101112">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MiniPrompter">
  <meta name="application-name" content="MiniPrompter">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css?v=14">
  <title>MiniPrompter</title>
</head>
<body>
  <main id="libraryView" class="screen library-screen">
    <header class="library-header">
      <div class="brand-row">
        <img class="brand-icon" src="icons/icon.svg" alt="">
        <div><p class="eyebrow">TELEPROMPTER</p><h1>Mis discursos</h1></div>
        <button id="newButton" class="icon-button primary" aria-label="Nuevo discurso"><img src="icons/ui/plus-circle-fill.svg" alt=""></button>
      </div>
      <label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Buscar…" autocomplete="off"></label>
      <div class="library-actions">
        <button id="importTextButton"><img src="icons/ui/file-earmark-arrow-up.svg" alt="">Importar texto</button>
        <button id="backupButton"><img src="icons/ui/download.svg" alt="">Respaldar</button>
        <button id="restoreButton"><img src="icons/ui/upload.svg" alt="">Restaurar</button>
        <input id="fileInput" type="file" accept=".txt,text/plain" hidden>
        <input id="backupInput" type="file" accept=".json,application/json" hidden>
      </div>
    </header>
    <section id="emptyState" class="empty-state" hidden>
      <img src="icons/icon.svg" alt="">
      <h2>Tu primer discurso</h2>
      <p>Escribe o importa un texto para comenzar.</p>
      <button id="emptyNewButton" class="primary-button">Crear discurso</button>
    </section>
    <section id="scriptGrid" class="script-grid" aria-live="polite"></section>
  </main>

  <main id="editorView" class="screen editor-screen" hidden>
    <div class="editor-sheet">
      <header class="nav-bar">
        <button id="editorBack" class="text-button"><img src="icons/ui/chevron-left.svg" alt="">Volver</button>
        <span>Editar discurso</span>
        <button id="deleteButton" class="danger-button" aria-label="Eliminar"><img src="icons/ui/trash3.svg" alt=""></button>
      </header>
      <section class="editor-content">
        <div class="editor-scroll">
          <label for="titleInput">Título</label>
          <input id="titleInput" class="title-input" maxlength="100" placeholder="Sin título">
          <div class="format-toolbar" role="toolbar" aria-label="Formato del texto seleccionado">
            <select id="fontFamilySelect" aria-label="Tipografía para el texto seleccionado">
              <option value="system">Sistema</option><option value="avenir">Avenir</option><option value="georgia">Georgia</option><option value="helvetica">Helvetica</option><option value="menlo">Menlo</option>
            </select>
            <button id="boldButton" type="button" aria-label="Negrita"><img src="icons/ui/type-bold.svg" alt=""></button>
            <button id="italicButton" type="button" aria-label="Cursiva"><img src="icons/ui/type-italic.svg" alt=""></button>
            <button id="underlineButton" type="button" aria-label="Subrayado"><img src="icons/ui/type-underline.svg" alt=""></button>
            <button id="strikeButton" type="button" aria-label="Tachado"><img src="icons/ui/type-strikethrough.svg" alt=""></button>
            <div class="case-picker">
              <img src="icons/ui/type.svg" alt="">
              <select id="caseSelect" aria-label="Cambiar mayúsculas y minúsculas del texto seleccionado">
                <option value="">Cambiar mayúsculas y minúsculas</option><option value="upper">UPPERCASE</option><option value="lower">lowercase</option><option value="sentence">Tipo oración</option>
              </select>
            </div>
          </div>
          <div id="bodyInput" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Texto del discurso" data-placeholder="Escribe tu discurso…" spellcheck="true"></div>
        </div>
        <div class="editor-footer">
          <span id="wordCount">0 palabras</span>
          <button id="playButton" class="primary-button"><img src="icons/ui/play-fill.svg" alt="">Reproducir</button>
        </div>
      </section>
    </div>
  </main>

  <main id="prompterView" class="screen prompter-screen" hidden>
    <div id="prompterStage" class="prompter-stage">
      <header id="prompterHeader" class="prompter-header">
        <button id="prompterBack" class="text-button"><img src="icons/ui/chevron-left.svg" alt="">Volver</button>
        <span id="prompterTitle">Discurso</span>
        <button id="settingsButton" class="icon-button" aria-label="Ajustes"><img src="icons/ui/gear-fill.svg" alt=""></button>
      </header>
      <div id="scrollViewport" class="scroll-viewport">
        <div id="scriptTransform" class="script-transform">
          <article id="prompterText" class="prompter-text"></article>
        </div>
      </div>
      <div id="cue" class="cue" aria-hidden="true"></div>
      <div id="countdownOverlay" class="countdown-overlay" hidden>
        <strong id="countdownNumber"></strong>
        <span id="countdownMessage"></span>
      </div>
      <section id="controls" class="controls">
        <div class="speed-row">
          <img class="animal-icon" src="icons/ui/turtle.png" alt="Lento">
          <input id="speedSlider" type="range" min="0" max="40" step="1" value="10" aria-label="Velocidad">
          <img class="animal-icon" src="icons/ui/rabbit.png" alt="Rápido">
          <output id="speedOutput" class="visually-hidden">10 · 0,9 líneas/s</output>
        </div>
        <div class="control-row">
          <button id="restartButton" aria-label="Volver al inicio"><img src="icons/ui/skip-start-fill.svg" alt=""></button>
          <button id="startButton" class="round-control" aria-label="Iniciar"><img id="playIcon" src="icons/ui/play-fill.svg" alt=""></button>
          <button id="mirrorVButton" aria-label="Invertir verticalmente"><img src="icons/ui/arrow-down-up.svg" alt=""></button>
          <button id="mirrorHButton" aria-label="Invertir horizontalmente"><img src="icons/ui/arrow-left-right.svg" alt=""></button>
          <button id="fontDownButton" aria-label="Letra más pequeña"><img class="type-small" src="icons/ui/type.svg" alt=""></button>
          <button id="fontUpButton" aria-label="Letra más grande"><img class="type-large" src="icons/ui/type.svg" alt=""></button>
        </div>
      </section>
    </div>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog">
      <header><button value="cancel" class="text-button">Volver</button><strong>Ajustes</strong><button value="ok" class="text-button">Listo</button></header>
      <div class="settings-body">
        <div class="setting-group">
          <div class="setting-heading"><label for="fontSlider">Tamaño del texto</label><output id="fontOutput" for="fontSlider">62</output></div>
          <input id="fontSlider" type="range" min="28" max="104" step="2" value="62">
        </div>
        <div class="setting-group">
          <div class="setting-heading"><label for="marginSlider">Márgenes</label><output id="marginOutput" for="marginSlider">8%</output></div>
          <input id="marginSlider" type="range" min="2" max="24" step="1" value="8">
        </div>
        <label class="setting-row color-row"><span>Color del texto</span><input id="textColorInput" type="color" value="#ffffff" aria-label="Color del texto"></label>
        <fieldset class="setting-group countdown-setting">
          <legend>Cuenta regresiva</legend>
          <div class="segmented-control" role="radiogroup" aria-label="Cuenta regresiva">
            <label><input type="radio" name="countdown" value="0"><span>No</span></label>
            <label><input type="radio" name="countdown" value="3"><span>3</span></label>
            <label><input type="radio" name="countdown" value="5" checked><span>5</span></label>
            <label><input type="radio" name="countdown" value="10"><span>10</span></label>
            <label><input type="radio" name="countdown" value="15"><span>15</span></label>
            <label><input type="radio" name="countdown" value="20"><span>20</span></label>
          </div>
        </fieldset>
        <label class="setting-toggle">
          <span>Indicador lateral</span>
          <span class="switch-control"><input id="cueToggle" type="checkbox" checked><span class="switch" aria-hidden="true"></span></span>
        </label>
        <label class="setting-toggle">
          <span>Ocultar controles al iniciar</span>
          <span class="switch-control"><input id="autoHideToggle" type="checkbox" checked><span class="switch" aria-hidden="true"></span></span>
        </label>
        <button id="fullscreenButton" type="button" class="settings-action">Usar pantalla completa</button>
        <button id="wakeLockButton" type="button" class="settings-action">Mantener pantalla encendida</button>
        <small id="wakeLockStatus" class="setting-status" aria-live="polite">Se activa automáticamente al reproducir.</small>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js?v=14" defer></script>
</body>
</html>
