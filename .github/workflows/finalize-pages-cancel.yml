name: Finalize stale Pages cancellation
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale deployment and allow propagation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/pages/deployments/6583ae619bd3b50131881e0298fdb278f5c77c97/cancel || true
          gh api --method POST repos/${{ github.repository }}/pages/deployments/6370426124/cancel || true
          gh api repos/${{ github.repository }}/pages/deployments/6583ae619bd3b50131881e0298fdb278f5c77c97 || true
          sleep 120
          gh api --method POST repos/${{ github.repository }}/pages/deployments/6583ae619bd3b50131881e0298fdb278f5c77c97/cancel || true
          gh api --method POST repos/${{ github.repository }}/pages/deployments/6370426124/cancel || true
          gh api repos/${{ github.repository }}/pages/deployments/6583ae619bd3b50131881e0298fdb278f5c77c97 || true
