name: Recover stuck Pages deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel and verify stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            gh api --method POST repos/${{ github.repository }}/pages/deployments/6583ae619bd3b50131881e0298fdb278f5c77c97/cancel || true
            status=$(gh api repos/${{ github.repository }}/pages/deployments/6583ae619bd3b50131881e0298fdb278f5c77c97 --jq .status)
            echo "Attempt $attempt: $status"
            if [ "$status" != "updating_pages" ]; then exit 0; fi
            sleep 10
          done
          exit 1
